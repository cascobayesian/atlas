# Publish the atlas's pages and code to GitHub Pages.  The data (data/<key>/ and assets/world/) is not in git or in
# this deploy: it is served from the Cloudflare R2 bucket behind votingblocatlas.org (assets/host.js), uploaded place
# by place with scripts/publish_place.sh, so a deploy is a few tens of MB however many places the atlas holds.
name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Drop what the site does not serve
        run: rm -rf scripts drafts .gitignore README.md && du -sh .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
