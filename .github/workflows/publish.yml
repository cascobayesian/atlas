# Publish the atlas to GitHub Pages: the pages and code from this repo, plus the data bundle
# (atlas-data.tar.gz on the "data" release, uploaded by scripts/publish_data.sh). The data stays out of git,
# so re-exports replace the bundle instead of adding to the history.
name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the data bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data --pattern atlas-data.tar.gz --dir /tmp
          mkdir -p data && tar -xzf /tmp/atlas-data.tar.gz -C data
          rm -rf scripts .gitignore README.md
          du -sh .
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
